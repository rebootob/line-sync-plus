<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LineSync Plus | Customer Management</title>
    <style>
        /* สไตล์แบบ Standard Admin Dashboard */
        :root { --primary: #00c300; --primary-dark: #009900; --bg: #f5f7fa; --text: #333; --border: #e2e8f0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .dashboard-container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; }
        
        /* Header & Toolbar */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .toolbar { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 15px; }
        .search-box { flex: 1; padding: 10px 15px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
        .search-box:focus { border-color: var(--primary); }
        .action-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .action-btn:hover { background: var(--primary-dark); }
        .action-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* Table */
        .table-wrapper { height: 550px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; position: relative; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        thead th { background: #f8fafc; padding: 12px 15px; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 1; color: #475569; font-weight: 600; }
        tbody td { padding: 12px 15px; border-bottom: 1px solid var(--border); }
        tbody tr:hover { background: #f1f8e9; }
        .checkbox-cell { text-align: center; width: 40px; }
        .name-clean { color: #15803d; font-weight: 600; }
        .name-original { color: #64748b; font-size: 12px; }
        .line-id { color: #64748b; font-family: monospace; }

        /* Pagination */
        .pagination { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; font-size: 14px; color: #64748b; }
        .page-controls button { padding: 5px 12px; margin: 0 5px; border: 1px solid var(--border); background: white; border-radius: 4px; cursor: pointer; }
        .page-controls button:hover:not(:disabled) { background: #f1f5f9; }
        .page-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h2 style="margin: 0;">🚀 LineSync Plus - Customer Management</h2>
            <div style="text-align: right;">
                <div id="statusBadge" style="font-size: 14px; color: #64748b;">กำลังโหลดข้อมูล...</div>
                <strong id="selectedCount" style="color: var(--primary);">เลือกแล้ว: 0 คน</strong>
            </div>
        </div>

        <div class="toolbar">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 ค้นหาชื่อ หรือ รหัส Line ID..." oninput="handleSearch()">
            <button class="action-btn" id="btnPrepareCampaign" onclick="prepareCampaign()" disabled>
                ✉️ สร้างแคมเปญส่งข้อความ
            </button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="checkbox-cell"><input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()"></th>
                        <th width="5%">ลำดับ</th>
                        <th width="30%">ชื่อที่จัดรูปแบบแล้ว</th>
                        <th width="25%">ชื่อดั้งเดิมบน LINE</th>
                        <th width="35%">รหัส Line ID</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" style="text-align: center; padding: 30px;">⏳ กำลังดึงข้อมูลจากระบบ...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <span id="pageInfo">แสดง 0 ถึง 0 จาก 0 รายการ</span>
            <div class="page-controls">
                <button onclick="changePage(-1)" id="btnPrev">◀ ก่อนหน้า</button>
                <span id="currentPageDisplay" style="font-weight: bold; margin: 0 10px;">1</span>
                <button onclick="changePage(1)" id="btnNext">ถัดไป ▶</button>
            </div>
        </div>
    </div>

    <script>
        // State Management (จัดการตัวแปรระบบ)
        let allCustomers = [];         // เก็บข้อมูลทั้งหมดจาก Database
        let filteredCustomers = [];    // เก็บข้อมูลหลังจากการค้นหา
        let selectedUsers = new Set(); // เก็บ Line ID ของคนที่ถูกติ๊กเลือก (ใช้ Set เพื่อความไว)
        
        let currentPage = 1;
        const rowsPerPage = 100;       // เรนเดอร์ทีละ 100 แถวให้เบราว์เซอร์ไม่ค้าง

        // 1. โหลดข้อมูลรอบเดียว (Fetch Data)
        async function loadData() {
            try {
                const res = await fetch('http://localhost:3000/api/customers');
                allCustomers = await res.json();
                filteredCustomers = [...allCustomers]; // ก๊อปปี้ข้อมูลสำหรับแสดงผล
                
                document.getElementById('statusBadge').innerText = `ซิงค์ข้อมูลสำเร็จ: ${allCustomers.length.toLocaleString()} เรคคอร์ด`;
                renderTable();
            } catch (error) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้</td></tr>`;
            }
        }

        // 2. เรนเดอร์ข้อมูลลงตาราง (Render Table - High Performance)
        function renderTable() {
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedData = filteredCustomers.slice(start, end);
            
            const tbody = document.getElementById('tableBody');
            
            if (paginatedData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px;">ไม่พบข้อมูลที่ค้นหา</td></tr>`;
            } else {
                // ใช้การต่อ String (Template Literal) เพื่อความรวดเร็วในการปั้น DOM
                tbody.innerHTML = paginatedData.map((cust, index) => `
                    <tr>
                        <td class="checkbox-cell">
                            <input type="checkbox" class="row-checkbox" value="${cust.lineUserId}" 
                                onchange="toggleSingleSelect('${cust.lineUserId}')" 
                                ${selectedUsers.has(cust.lineUserId) ? 'checked' : ''}>
                        </td>
                        <td>${start + index + 1}</td>
                        <td class="name-clean">${cust.cleanedDisplayName}</td>
                        <td class="name-original">${cust.displayName || '-'}</td>
                        <td class="line-id">${cust.lineUserId}</td>
                    </tr>
                `).join('');
            }

            updatePaginationUI();
            updateSelectAllCheckbox();
        }

        // 3. ระบบค้นหา (Search - Realtime)
        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            
            // ค้นหาแบบไว โดยเช็คจากทั้งชื่อล้างแล้ว, ชื่อเดิม และ Line ID
            filteredCustomers = allCustomers.filter(cust => 
                (cust.cleanedDisplayName && cust.cleanedDisplayName.toLowerCase().includes(keyword)) ||
                (cust.displayName && cust.displayName.toLowerCase().includes(keyword)) ||
                (cust.lineUserId && cust.lineUserId.toLowerCase().includes(keyword))
            );
            
            currentPage = 1; // กลับไปหน้าแรกเสมอเมื่อค้นหา
            renderTable();
        }

        // 4. ระบบเปลี่ยนหน้า (Pagination Logic)
        function changePage(direction) {
            const totalPages = Math.ceil(filteredCustomers.length / rowsPerPage);
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderTable();
        }

        function updatePaginationUI() {
            const totalPages = Math.ceil(filteredCustomers.length / rowsPerPage);
            const start = (currentPage - 1) * rowsPerPage + 1;
            const end = Math.min(currentPage * rowsPerPage, filteredCustomers.length);
            
            document.getElementById('pageInfo').innerText = `แสดง ${filteredCustomers.length > 0 ? start : 0} ถึง ${end} จาก ${filteredCustomers.length.toLocaleString()} รายการ`;
            document.getElementById('currentPageDisplay').innerText = currentPage;
            
            document.getElementById('btnPrev').disabled = currentPage === 1;
            document.getElementById('btnNext').disabled = currentPage === totalPages || totalPages === 0;
        }

        // 5. ระบบ Checkbox (Selection System)
        function toggleSingleSelect(userId) {
            if (selectedUsers.has(userId)) {
                selectedUsers.delete(userId);
            } else {
                selectedUsers.add(userId);
            }
            updateSelectionUI();
        }

        function toggleSelectAll() {
            const isChecked = document.getElementById('selectAllCheckbox').checked;
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const currentViewData = filteredCustomers.slice(start, end);

            currentViewData.forEach(cust => {
                if (isChecked) {
                    selectedUsers.add(cust.lineUserId);
                } else {
                    selectedUsers.delete(cust.lineUserId);
                }
            });
            renderTable(); // วาดตารางใหม่เพื่ออัปเดตสถานะ checkbox ทันที
            updateSelectionUI();
        }

        function updateSelectAllCheckbox() {
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const currentViewData = filteredCustomers.slice(start, end);
            
            const allCheckedInView = currentViewData.length > 0 && currentViewData.every(cust => selectedUsers.has(cust.lineUserId));
            document.getElementById('selectAllCheckbox').checked = allCheckedInView;
        }

        function updateSelectionUI() {
            document.getElementById('selectedCount').innerText = `เลือกแล้ว: ${selectedUsers.size.toLocaleString()} คน`;
            // เปิดปุ่มส่งแคมเปญถ้ามีการเลือกมากกว่า 0
            document.getElementById('btnPrepareCampaign').disabled = selectedUsers.size === 0;
        }

        // ทดสอบปุ่มส่งข้อมูล (เตรียมเข้าสู่ระบบถัดไป)
// ทดสอบปุ่มส่งข้อมูล (เตรียมเข้าสู่ระบบถัดไป)
        async function prepareCampaign() {
            const targetIds = Array.from(selectedUsers);
            if (targetIds.length === 0) return;

            // ให้ผู้ใช้พิมพ์ข้อความที่จะส่ง
            const message = prompt(`กรุณาพิมพ์ข้อความที่จะส่งให้ลูกค้า ${targetIds.length} คน:\n(ข้อความเดียวกันทั้งหมด)`);
            
            if (!message || message.trim() === '') {
                alert('ยกเลิกการส่ง เนื่องจากไม่ได้กรอกข้อความ');
                return;
            }

            try {
                // ยิงข้อมูลไปเข้าคิวที่ NestJS
                document.getElementById('btnPrepareCampaign').innerText = '⏳ กำลังสร้างคิว...';
                document.getElementById('btnPrepareCampaign').disabled = true;

                const res = await fetch('http://localhost:3000/api/campaign/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ targetIds: targetIds, message: message })
                });

                const data = await res.json();
                
                if (data.success) {
                    alert(`✅ นำข้อความเข้าคิวสำเร็จจำนวน ${data.queuedCount} รายการ!\n\nขั้นตอนต่อไป: ให้ไปเปิด Tampermonkey Script ที่หน้าเว็บ LINE OA เพื่อให้บอทเริ่มพิมพ์ข้อความครับ`);
                    // เคลียร์ค่าหลังจากเอาเข้าคิวสำเร็จ
                    selectedUsers.clear();
                    renderTable();
                }
            } catch (error) {
                console.error(error);
                alert('❌ เกิดข้อผิดพลาดในการเชื่อมต่อกับระบบคิว');
            } finally {
                document.getElementById('btnPrepareCampaign').innerText = '✉️ สร้างแคมเปญส่งข้อความ';
                updateSelectionUI();
            }
        }

        // เริ่มต้นการทำงาน
        window.onload = loadData;
    </script>
</body>
</html>
